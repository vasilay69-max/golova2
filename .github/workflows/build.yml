name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build custom Buildozer environment
        run: docker build -t my-buildozer -f Dockerfile.buildozer .

      - name: Build APK with Buildozer
        run: |
          docker run --rm \
            -e HOME=/home/user \
            -w /home/user/hostcwd \
            -v "${{ github.workspace }}":/home/user/hostcwd \
            -v "$HOME/.buildozer":/home/user/.buildozer \
            my-buildozer buildozer android debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: headache-apk
          path: bin/*.apk
